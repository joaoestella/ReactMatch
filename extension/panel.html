<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SyncVideo</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div class="brand"><span class="brand-icon" aria-hidden="true">⇄</span><span>Sync<b>Video</b></span></div>
    <label class="lang" data-i18n-title="lang.label"><span aria-hidden="true">🌐</span><select id="lang" data-i18n-aria-label="lang.label"></select></label>
  </header>

  <main>
    <div id="demo-banner" class="notice" hidden><span data-i18n="demo.banner"></span> <button id="leave-demo" class="link" data-i18n="demo.leave"></button></div>

    <section class="step" aria-labelledby="step1">
      <h2 id="step1"><span class="num">1</span> <span data-i18n="step.videos"></span></h2>
      <article class="source" data-role="reference">
        <div class="source-head"><span class="badge">1</span><div><h3 data-i18n="a.title"></h3><p data-i18n="a.sub"></p></div><span class="connection" id="reference-connection" data-i18n="conn.none"></span></div>
        <div class="row"><select id="reference-tab" data-i18n-aria-label="a.title"><option value="" data-i18n="tabs.pick"></option></select><button id="reference-connect" class="button" data-i18n="tab.connect"></button></div>
        <select id="reference-player" class="player-select" hidden data-i18n-aria-label="player.found"></select>
        <button id="reference-allow" class="button allow" hidden></button>
        <div class="source-foot"><span class="time" id="reference-time">—:—</span><span id="reference-info" class="muted" data-i18n="a.info"></span><button id="reference-capture" class="link" disabled data-i18n="clock.select"></button></div>
      </article>
      <article class="source" data-role="follower">
        <div class="source-head"><span class="badge two">2</span><div><h3 data-i18n="b.title"></h3><p data-i18n="b.sub"></p></div><span class="connection" id="follower-connection" data-i18n="conn.none"></span></div>
        <div class="row"><select id="follower-tab" data-i18n-aria-label="b.title"><option value="" data-i18n="tabs.pick"></option></select><button id="follower-connect" class="button" data-i18n="tab.connect"></button></div>
        <select id="follower-player" class="player-select" hidden data-i18n-aria-label="player.found"></select>
        <button id="follower-allow" class="button allow" hidden></button>
        <div class="source-foot"><span class="time" id="follower-time">—:—</span><span id="follower-info" class="muted" data-i18n="b.info"></span><button id="follower-capture" class="link" disabled data-i18n="clock.select"></button></div>
      </article>
      <div class="tools"><button id="arrange" class="button ghost" data-i18n="btn.arrange"></button><button id="refresh" class="link" data-i18n="tools.refresh"></button></div>
      <p class="hint" data-i18n="tools.hint"></p>
    </section>

    <section class="step" aria-labelledby="step2">
      <h2 id="step2"><span class="num">2</span> <span data-i18n="step.sync"></span></h2>
      <div class="status"><span id="status-dot" class="dot"></span><div><strong id="status-title" data-i18n="status.welcome"></strong><p id="status-detail" role="status" aria-live="polite" data-i18n="status.welcome.detail"></p></div></div>
      <button id="start" class="button primary" disabled data-i18n="start.start"></button>
      <div class="fine" role="group" data-i18n-aria-label="fine.label"><span data-i18n="fine.title"></span><button id="trim-minus" class="button small" disabled data-i18n-aria-label="fine.minus">− 0.5 s</button><output id="trim-value">0.0 s</output><button id="trim-plus" class="button small" disabled data-i18n-aria-label="fine.plus">+ 0.5 s</button><button id="trim-reset" class="link" disabled data-i18n="fine.reset"></button></div>
      <p class="hint" data-i18n="fine.sub"></p>
    </section>

    <details id="advanced" class="step advanced">
      <summary data-i18n="adv.summary"></summary>
      <h3 data-i18n="adv.moment.title"></h3>
      <p class="hint" data-i18n="help.timeline"></p>
      <div class="row wrap"><button id="pause-both" class="button" disabled data-i18n="btn.pauseBoth"></button><button id="mark-moment" class="button" disabled data-i18n="calibrate.timeline"></button></div>
      <h3 data-i18n="adv.times.title"></h3>
      <p class="hint" data-i18n="adv.times"></p>
      <div class="fields"><label><span data-i18n="fields.a"></span><input id="clock-reference" type="text" placeholder="25:40" inputmode="numeric" autocomplete="off"></label><label><span data-i18n="fields.b"></span><input id="clock-follower" type="text" placeholder="25:28" inputmode="numeric" autocomplete="off"></label><label><span data-i18n="fields.direction"></span><select id="direction"><option value="1" data-i18n="fields.up"></option><option value="-1" data-i18n="fields.down"></option></select></label></div>
      <div class="row wrap"><button id="read-clocks" class="button" disabled data-i18n="btn.read"></button><button id="apply-times" class="button" disabled data-i18n="calibrate.clock"></button><button id="clear-captures" class="link" hidden data-i18n="btn.clearCaptures"></button></div>
      <p id="anchor-label" class="hint" data-i18n="anchor.none"></p>
    </details>

    <details class="step help">
      <summary data-i18n="help.summary"></summary>
      <p data-i18n="help.p1"></p><p data-i18n="help.p2"></p><p data-i18n="help.p3"></p><p data-i18n="help.p4"></p>
      <button id="demo" class="button ghost"><span id="demo-label" data-i18n="demo.try"></span></button>
      <button id="simulate-drift" class="link" hidden data-i18n="demo.drift"></button>
    </details>
  </main>

  <footer><span data-i18n="top.local"></span> · <a href="https://joaoestella.github.io/SyncVideo/" target="_blank" rel="noopener" data-i18n="privacy.link"></a> · <span id="version"></span></footer>

  <dialog id="crop-dialog"><div class="dialog-header"><div><p class="eyebrow" data-i18n="crop.eyebrow"></p><h2 data-i18n="crop.title"></h2></div><button id="crop-close" class="button small" data-i18n-aria-label="crop.cancel">✕</button></div><p class="hint" data-i18n="crop.hint"></p><canvas id="crop-canvas" data-i18n-aria-label="crop.canvas"></canvas><p id="crop-description" role="status" data-i18n="crop.none"></p><div id="crop-options" class="crop-options" hidden></div><div class="dialog-actions"><button id="crop-full" class="button" data-i18n="crop.full"></button><button id="crop-save" class="button primary" disabled data-i18n="crop.save"></button></div></dialog>
  <script src="vendor/tesseract/tesseract.min.js"></script>
  <script type="module" src="panel.js"></script>
</body>
</html>
